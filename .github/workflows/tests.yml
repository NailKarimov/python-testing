name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write # publish the Allure report to the gh-pages branch
  pull-requests: write # comment the test summary on pull requests

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint, format and type check
        run: |
          ruff check .
          ruff format --check .
          mypy services tests

      - name: Tests (API, contract, property-based, integration, security)
        id: tests
        continue-on-error: true
        run: pytest -n 4 --alluredir=allure-results --junitxml=junit.xml

      - name: Annotate failures and write the summary
        if: always() && hashFiles('junit.xml') != ''
        run: |
          python scripts/ci_report.py junit.xml summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the summary on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo '<!-- test-summary -->'; echo '## Test results'; echo; cat summary.md; } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '[.[] | select(.body | startswith("<!-- test-summary -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - uses: actions/setup-java@v6 # Allure CLI needs Java
        if: always()
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        if: always()
        with:
          node-version: 22

      - name: Restore Allure history
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 || exit 0
          git worktree add gh-pages-old origin/gh-pages || exit 0
          if [ -d gh-pages-old/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages-old/history/. allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: |
          printf 'Python=%s\nRun=GitHub Actions\nCommit=%s\n' "$(python --version | cut -d' ' -f2)" "${GITHUB_SHA::7}" > allure-results/environment.properties
          npx --yes allure-commandline@2.46.1 generate allure-results -o allure-report --clean
          for f in docs/*.html; do if [ -f "$f" ]; then cp "$f" allure-report/; fi; done
          if [ -d gh-pages-old/load ]; then cp -r gh-pages-old/load allure-report/; fi

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the Bookshop
        run: |
          mkdir -p load-results
          BOOKSHOP_DB=$PWD/load-results/load.db nohup uvicorn services.bookshop.app:app --port 8000 \
            --log-level warning --no-server-header > load-results/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          exit 1

      - name: Locust, 30 users for 45 s
        run: |
          locust -f load/locustfile.py --headless -u 30 -r 10 -t 45s --host http://127.0.0.1:8000 \
            --csv load-results/run --html load-results/locust.html --only-summary

      - name: Check the budgets
        run: python scripts/load_check.py load-results/run_stats.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the Locust report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locust-report
          path: load-results
          retention-days: 14
